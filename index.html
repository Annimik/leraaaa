<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днем Рождения, Валерия! 🏠</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="room">
        <!-- Окно со снегом -->
        <div class="window">
            <div class="snow"></div>
        </div>

        <!-- Камин (Интерактивный предмет 1) -->
        <div class="fireplace clickable" id="item-warmth">
            <div class="fire"></div>
            <div class="mantel"></div>
        </div>

        <!-- Ёлка (Интерактивный предмет 2) -->
        <div class="tree clickable" id="item-eyes">
            <div class="tree-layer l1"></div>
            <div class="tree-layer l2"></div>
            <div class="tree-layer l3"></div>
            <div class="lights"></div>
        </div>

        <!-- Диван со стикменами под пледом -->
        <div class="sofa">
            <div class="stickmen-group">
                <div class="stickman s1"></div>
                <div class="stickman s2"></div>
                <div class="blanket"></div>
            </div>
        </div>

        <!-- Снеговик-игрушка (Интерактивный предмет 3) -->
        <div class="snowman-toy clickable" id="item-crafts">
            <div class="s-ball b1"></div>
            <div class="s-ball b2"></div>
            <div class="carrot"></div>
        </div>

        <!-- Письмо на столике (Интерактивный предмет 4) -->
        <div class="table">
            <div class="letter-paper clickable" id="item-letter">
                <div class="letter-lines"></div>
            </div>
        </div>
    </div>

    <!-- Модальные окна -->
    <div id="modal-container" class="modal-overlay hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modal-body-text"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
